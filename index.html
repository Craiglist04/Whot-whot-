<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Whot Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0c1220;
      color: #e8eef7;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
    }
    .wrap { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 14px; }
    header h1 { font-size: 1.6rem; font-weight: 800; color: #fbbf24; }
    header p { font-size: 0.8rem; color: #64748b; }

    .screen { display: none; }
    .screen.active { display: block; }

    .box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .box h3 { color: #fbbf24; font-size: 0.95rem; margin-bottom: 10px; }

    input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 8px;
      color: #e8eef7;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 10px;
      outline: none;
    }
    input:focus { border-color: #22c55e; }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
      margin-bottom: 8px;
    }
    .btn-main { background: #22c55e; color: #052e16; }
    .btn-main:disabled { opacity: 0.4; }
    .btn-sec { background: #334155; color: #e2e8f0; }
    .btn-gold { background: linear-gradient(135deg,#f59e0b,#d97706); color: #000; }
    .btn-danger { background: transparent; border: 1px solid #ef4444; color: #ef4444; }

    .room-code {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 6px;
      color: #fbbf24;
      text-align: center;
      padding: 12px;
      background: #0f172a;
      border-radius: 10px;
      margin: 8px 0 12px;
    }

    .player-list { list-style: none; }
    .player-list li {
      display: flex;
      justify-content: space-between;
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .you { color: #4ade80; font-weight: 600; }
    .host-tag { font-size: 0.7rem; color: #fbbf24; }

    .status {
      background: #1e293b;
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 10px;
      text-align: center;
      border: 1px solid #334155;
      font-size: 0.9rem;
    }
    .status.turn { border-color: #22c55e; color: #4ade80; }
    .status.warn { border-color: #f59e0b; color: #fbbf24; }

    .opponents {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px;
    }
    .opp {
      background: #1e293b; border: 1px solid #334155; border-radius: 10px;
      padding: 8px 12px; min-width: 80px; text-align: center; font-size: 0.8rem;
    }
    .opp.active { border-color: #22c55e; }
    .opp .name { font-weight: 600; }

    .table {
      display: flex; justify-content: center; align-items: center; gap: 20px;
      margin: 14px 0; min-height: 120px;
    }
    .deck, .pile {
      width: 74px; height: 104px; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 700; box-shadow: 0 4px 12px #00000060;
    }
    .deck {
      background: linear-gradient(145deg,#1e3a5f,#0f172a);
      border: 2px solid #334155; color: #94a3b8; font-size: 0.75rem; cursor: pointer;
    }
    .card {
      width: 68px; height: 96px; border-radius: 10px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-weight: 800; box-shadow: 0 3px 10px #00000050; border: 2px solid #ffffff20; flex-shrink: 0;
    }
    .card .num { font-size: 1.35rem; }
    .card .shape { font-size: 1.4rem; margin-top: 3px; }

    .circle { background:#dc2626; color:#fff; }
    .triangle { background:#16a34a; color:#fff; }
    .cross { background:#2563eb; color:#fff; }
    .square { background:#ca8a04; color:#fff; }
    .star { background:#7c3aed; color:#fff; }

    .hand {
      display: flex; gap: 6px; overflow-x: auto; padding: 8px 4px 12px; min-height: 110px;
    }
    .hand .card { cursor: pointer; }
    .hand .card.playable {
      box-shadow: 0 0 0 3px #22c55e; transform: translateY(-5px);
    }
    .hand .card.disabled { opacity: 0.4; pointer-events: none; }

    .actions { display: flex; gap: 8px; }
    .actions button { margin-bottom: 0; }

    .effect { text-align: center; color: #fbbf24; font-size: 0.85rem; min-height: 20px; margin-bottom: 4px; }

    .winner-screen {
      display: none; position: fixed; inset: 0; background: #0c1220ee; z-index: 50;
      align-items: center; justify-content: center; flex-direction: column; gap: 12px;
      text-align: center; padding: 20px;
    }
    .winner-screen.show { display: flex; }
    .winner-screen h2 { color: #fbbf24; font-size: 1.5rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>WHOT ONLINE</h1>
      <p>Play with friends on different phones</p>
    </header>

    <!-- LOGIN -->
    <div id="loginScreen" class="screen active">
      <div class="box">
        <h3>Your Name</h3>
        <input id="nameInput" placeholder="Enter your name" maxlength="12" />
        <button class="btn-gold" onclick="createRoom()">Create Room</button>
        <button class="btn-sec" onclick="showJoin()">Join Room</button>
      </div>
    </div>

    <!-- JOIN -->
    <div id="joinScreen" class="screen">
      <div class="box">
        <h3>Join Room</h3>
        <input id="codeInput" placeholder="ROOM CODE" maxlength="4" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:1.3rem" />
        <button class="btn-main" onclick="joinRoom()">Join</button>
        <button class="btn-sec" onclick="showLogin()">Back</button>
      </div>
    </div>

    <!-- LOBBY -->
    <div id="lobbyScreen" class="screen">
      <div class="box">
        <h3>Room Code</h3>
        <div class="room-code" id="roomCode">----</div>
        <p style="text-align:center;font-size:0.8rem;color:#94a3b8;margin-bottom:10px">
          Share this code with friends
        </p>
        <h3>Players (<span id="pCount">0</span>)</h3>
        <ul class="player-list" id="pList"></ul>
        <button class="btn-main" id="startBtn" onclick="startGame()" style="display:none">Start Game</button>
        <button class="btn-danger" onclick="location.reload()">Leave</button>
      </div>
    </div>

    <!-- GAME -->
    <div id="gameScreen" class="screen">
      <div id="status" class="status">Waiting...</div>
      <div id="effect" class="effect"></div>
      <div class="opponents" id="opponents"></div>
      <div class="table">
        <div class="deck" onclick="drawCard()">
          <div style="font-size:1.2rem">🂠</div>
          <div id="deckCount">0</div>
        </div>
        <div id="discard" class="pile"></div>
      </div>
      <div style="text-align:center;font-size:0.75rem;color:#64748b;margin-bottom:4px" id="handLabel">Your cards</div>
      <div class="hand" id="hand"></div>
      <div class="actions">
        <button class="btn-sec" onclick="location.reload()">Quit</button>
        <button class="btn-main" id="passBtn" onclick="passTurn()" disabled>Pass</button>
      </div>
    </div>
  </div>

  <div class="winner-screen" id="winnerScreen">
    <h2 id="winnerTitle">Winner!</h2>
    <p id="winnerMsg"></p>
    <div id="scoreBox" style="display:none;background:#1e293b;border-radius:10px;padding:12px;width:100%;max-width:260px;text-align:left"></div>
    <button class="btn-main" style="max-width:200px;margin-top:10px" onclick="location.reload()">Back to Home</button>
  </div>

  <script>
    const SHAPE_ICON = { circle:"●", triangle:"▲", cross:"✚", square:"■", star:"★" };
    const socket = io();

    let myName = "";
    let myId = "";
    let state = null;
    let lastDrawn = false;

    socket.on("connect", () => { myId = socket.id; });

    function show(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }

    function showLogin() { show("loginScreen"); }
    function showJoin() {
      document.getElementById("codeInput").value = "";
      show("joinScreen");
    }

    function createRoom() {
      myName = document.getElementById("nameInput").value.trim();
      if (!myName) return alert("Enter your name");
      socket.emit("create_room", { name: myName });
    }

    function joinRoom() {
      myName = document.getElementById("nameInput").value.trim();
      if (!myName) {
        // coming from join screen – ask name if empty
        myName = prompt("Your name?");
        if (!myName) return;
      }
      const code = document.getElementById("codeInput").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!code) return alert("Enter room code");
      socket.emit("join_room", { code, name: myName });
    }

    socket.on("room_created", ({ code }) => {
      document.getElementById("roomCode").textContent = code;
      show("lobbyScreen");
    });

    socket.on("room_joined", ({ code }) => {
      document.getElementById("roomCode").textContent = code;
      show("lobbyScreen");
    });

    socket.on("error_msg", (msg) => alert(msg));

    socket.on("room_state", (s) => {
      state = s;
      if (s.gameOver) {
        showWinner(s);
        return;
      }
      if (s.started) {
        show("gameScreen");
        renderGame(s);
      } else {
        renderLobby(s);
      }
    });

    function renderLobby(s) {
      document.getElementById("roomCode").textContent = s.code;
      document.getElementById("pCount").textContent = s.players.length;
      document.getElementById("pList").innerHTML = s.players.map(p => `
        <li>
          <span class="${p.id === myId ? 'you' : ''}">${p.name}${p.id === myId ? ' (you)' : ''}</span>
          ${p.id === s.hostId ? '<span class="host-tag">HOST</span>' : ''}
        </li>
      `).join("");

      const startBtn = document.getElementById("startBtn");
      if (s.hostId === myId) {
        startBtn.style.display = "block";
        startBtn.disabled = s.players.length < 2;
        startBtn.textContent = s.players.length < 2
          ? "Need 2+ players"
          : "▶ Start Game (" + s.players.length + " players)";
      } else {
        startBtn.style.display = "none";
      }
    }

    function startGame() {
      socket.emit("start_game");
    }

    function renderGame(s) {
      const isMyTurn = s.players[s.current] && s.players[s.current].id === myId;

      // Status
      const st = document.getElementById("status");
      if (s.pendingPick > 0 && isMyTurn) {
        st.textContent = "You must Pick " + s.pendingPick + " (cannot block)";
        st.className = "status warn";
      } else if (isMyTurn) {
        st.textContent = "Your turn";
        st.className = "status turn";
      } else {
        st.textContent = (s.players[s.current]?.name || "...") + "'s turn";
        st.className = "status";
      }

      document.getElementById("effect").textContent = s.effect || "";

      // Opponents
      document.getElementById("opponents").innerHTML = s.players.map((p, i) => {
        if (p.id === myId) return "";
        return `<div class="opp ${i === s.current ? 'active' : ''}">
          <div class="name">${p.name}</div>
          <div style="color:#94a3b8">${p.cardCount} cards</div>
        </div>`;
      }).join("");

      document.getElementById("deckCount").textContent = s.deckCount;

      // Discard
      const pile = document.getElementById("discard");
      if (s.topCard) {
        pile.className = "pile card " + s.topCard.shape;
        pile.innerHTML = `<div class="num">${s.topCard.num}</div><div class="shape">${SHAPE_ICON[s.topCard.shape]}</div>`;
      }

      // Hand
      document.getElementById("handLabel").textContent = isMyTurn ? "Your cards – tap to play" : "Your cards (wait for your turn)";
      const hand = document.getElementById("hand");
      hand.innerHTML = (s.yourHand || []).map(c => {
        const can = isMyTurn && canPlay(c, s);
        return `<div class="card ${c.shape} ${can ? 'playable' : 'disabled'}" onclick="playCard(${c.id})">
          <div class="num">${c.num}</div>
          <div class="shape">${SHAPE_ICON[c.shape]}</div>
        </div>`;
      }).join("");

      document.getElementById("passBtn").disabled = !(isMyTurn && lastDrawn && s.pendingPick === 0);
    }

    function canPlay(card, s) {
      if (s.pendingPick > 0) return false;
      if (!s.topCard) return true;
      return card.shape === s.topCard.shape || card.num === s.topCard.num;
    }

    function playCard(cardId) {
      lastDrawn = false;
      socket.emit("play_card", { cardId });
    }

    function drawCard() {
      if (!state) return;
      const isMyTurn = state.players[state.current]?.id === myId;
      if (!isMyTurn) return;
      lastDrawn = true;
      socket.emit("draw_card");
    }

    function passTurn() {
      lastDrawn = false;
      socket.emit("pass_turn");
    }

    function showWinner(s) {
      document.getElementById("winnerTitle").textContent = s.winner + " Wins!";
      document.getElementById("winnerMsg").textContent = s.effect || "";
      const box = document.getElementById("scoreBox");
      if (s.scores) {
        box.style.display = "block";
        box.innerHTML = s.scores.map((sc, i) =>
          `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155">
            <span>${i===0?"👑 ":""}${sc.name}</span><span>${sc.total} pts</span>
          </div>`
        ).join("");
      } else {
        box.style.display = "none";
      }
      document.getElementById("winnerScreen").classList.add("show");
    }
  </script>
</body>
</html>
