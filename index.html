<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Whot Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0c1220; color: #e8eef7; min-height: 100vh; padding: 12px; user-select: none; }
    .wrap { max-width: 480px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 14px; }
    header h1 { font-size: 1.5rem; font-weight: 800; color: #fbbf24; }
    header p { font-size: 0.8rem; color: #64748b; }
    .screen { display: none; }
    .screen.active { display: block; }
    .box { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .box h3 { color: #fbbf24; font-size: 0.95rem; margin-bottom: 10px; }
    input { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #e8eef7; padding: 12px; font-size: 1rem; margin-bottom: 10px; outline: none; }
    input:focus { border-color: #22c55e; }
    button { width: 100%; padding: 13px; border: none; border-radius: 10px; font-weight: 700; font-size: 0.95rem; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
    .btn-main { background: #22c55e; color: #052e16; }
    .btn-main:disabled { opacity: 0.4; }
    .btn-sec { background: #334155; color: #e2e8f0; }
    .btn-gold { background: linear-gradient(135deg,#f59e0b,#d97706); color: #000; }
    .btn-danger { background: transparent; border: 1px solid #ef4444; color: #ef4444; }
    .err { color: #f87171; font-size: 0.85rem; margin-bottom: 8px; }
    .room-code { font-size: 1.8rem; font-weight: 800; letter-spacing: 6px; color: #fbbf24; text-align: center; padding: 12px; background: #0f172a; border-radius: 10px; margin: 8px 0 12px; }
    .player-list { list-style: none; }
    .player-list li { display: flex; justify-content: space-between; padding: 10px 12px; background: #0f172a; border-radius: 8px; margin-bottom: 6px; }
    .you { color: #4ade80; font-weight: 600; }
    .host-tag { font-size: 0.7rem; color: #fbbf24; }
    .status { background: #1e293b; border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; text-align: center; border: 1px solid #334155; font-size: 0.9rem; }
    .status.turn { border-color: #22c55e; color: #4ade80; }
    .status.warn { border-color: #f59e0b; color: #fbbf24; }
    .timer-bar {
      height: 4px; background: #334155; border-radius: 2px; margin-top: 8px; overflow: hidden;
    }
    .timer-bar > div {
      height: 100%; background: #22c55e; width: 100%; transition: width 0.2s linear;
    }
    .timer-bar.warn > div { background: #f59e0b; }
    .timer-bar.danger > div { background: #ef4444; }
    .opponents { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    .opp { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 8px 12px; min-width: 80px; text-align: center; font-size: 0.8rem; }
    .opp.active { border-color: #22c55e; }
    .table { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 14px 0; min-height: 120px; }
    .deck, .pile { width: 74px; height: 104px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; box-shadow: 0 4px 12px #00000060; }
    .deck { background: linear-gradient(145deg,#1e3a5f,#0f172a); border: 2px solid #334155; color: #94a3b8; font-size: 0.75rem; cursor: pointer; }
    .card { width: 70px; height: 100px; border-radius: 8px; background: #faf7f2; color: #7f1d1d; position: relative; font-weight: 800; box-shadow: 0 3px 10px #00000050; border: 1.5px solid #c4b5a5; flex-shrink: 0; }
    .card .num-tl { position: absolute; top: 4px; left: 5px; font-size: 0.85rem; }
    .card .num-br { position: absolute; bottom: 4px; right: 5px; font-size: 0.85rem; transform: rotate(180deg); }
    .card .shape { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 1.8rem; color: #7f1d1d; }
    .hand { display: flex; gap: 6px; overflow-x: auto; padding: 8px 4px 12px; min-height: 110px; }
    .hand .card { cursor: pointer; }
    .hand .card.playable { box-shadow: 0 0 0 3px #22c55e; transform: translateY(-6px); border-color: #22c55e; }
    .hand .card.disabled { opacity: 0.4; pointer-events: none; }
    .actions { display: flex; gap: 8px; }
    .actions button { margin-bottom: 0; }
    .effect { text-align: center; color: #fbbf24; font-size: 0.85rem; min-height: 20px; margin-bottom: 4px; }
    .winner-screen { display: none; position: fixed; inset: 0; background: #0c1220ee; z-index: 50; align-items: center; justify-content: center; flex-direction: column; gap: 12px; text-align: center; padding: 20px; }
    .winner-screen.show { display: flex; }
    .winner-screen h2 { color: #fbbf24; font-size: 1.5rem; }
    .wallet { text-align: center; padding: 12px; background: #0f172a; border-radius: 10px; margin-bottom: 12px; border: 1px solid #fbbf2433; }
    .wallet .bal { font-size: 1.6rem; font-weight: 800; color: #4ade80; }
    .link { color: #fbbf24; cursor: pointer; background: none; border: none; width: auto; padding: 0; font-size: 0.9rem; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>WHOT ONLINE</h1>
      <p id="headerSub">Play with friends on different phones</p>
    </header>

    <!-- AUTH -->
    <div id="authScreen" class="screen active">
      <div class="box">
        <h3 id="authTitle">Sign In</h3>
        <div id="authErr" class="err" style="display:none"></div>
        <div id="authFields">
          <input id="authUser" placeholder="Username" autocomplete="username" />
          <input id="authEmail" placeholder="Email" type="email" style="display:none" />
          <input id="authPass" placeholder="Password" type="password" autocomplete="current-password" />
        </div>
        <div id="verifyBox" style="display:none">
          <p style="font-size:0.85rem;color:#94a3b8;margin-bottom:8px">Enter the 6-digit code (shown below in demo mode)</p>
          <div id="demoCode" style="text-align:center;font-size:1.4rem;letter-spacing:6px;color:#fbbf24;font-weight:800;margin-bottom:10px;padding:10px;background:#0f172a;border-radius:8px"></div>
          <input id="authCode" placeholder="000000" maxlength="6" style="text-align:center;letter-spacing:6px;font-size:1.2rem" />
        </div>
        <button class="btn-gold" id="authBtn" onclick="submitAuth()">SIGN IN</button>
        <p style="text-align:center;font-size:0.85rem;color:#94a3b8">
          <span id="authSwitch" class="link" onclick="toggleAuthMode()">No account? Register</span>
        </p>
      </div>
    </div>

    <!-- LOBBY / WALLET -->
    <div id="lobbyScreen" class="screen">
      <div class="wallet">
        <div style="font-size:0.75rem;color:#64748b">WALLET · <span id="lobbyName"></span></div>
        <div class="bal" id="lobbyBal">₦0</div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <input id="fundAmt" type="number" placeholder="Fund amount" style="margin-bottom:0;flex:1" />
          <button class="btn-main" style="width:auto;padding:12px 16px;margin:0" onclick="fundWallet()">FUND</button>
        </div>
      </div>
      <div class="box">
        <h3>Create Room</h3>
        <input id="createStake" type="number" placeholder="Table stake (₦) e.g. 200" value="200" />
        <button class="btn-gold" onclick="createRoom()">Create Room</button>
      </div>
      <div class="box">
        <h3>Join Room</h3>
        <input id="codeInput" placeholder="ROOM CODE" maxlength="6" style="text-transform:uppercase;letter-spacing:4px;text-align:center;font-size:1.2rem" />
        <button class="btn-main" onclick="joinRoom()">Join</button>
        <button class="btn-sec" onclick="refreshRooms()">Refresh active rooms</button>
        <div id="activeRooms" style="margin-top:8px"></div>
      </div>
      <button class="btn-danger" onclick="logout()">Log out</button>
    </div>

    <!-- ROOM -->
    <div id="roomScreen" class="screen">
      <div class="box">
        <h3>Room Code</h3>
        <div class="room-code" id="roomCode">----</div>
        <p style="text-align:center;font-size:0.8rem;color:#94a3b8;margin-bottom:8px" id="roomStakeLabel"></p>
        <h3>Players (<span id="pCount">0</span>)</h3>
        <ul class="player-list" id="pList"></ul>
        <button class="btn-main" id="startBtn" onclick="startGame()" style="display:none">Start Game</button>
        <button class="btn-danger" onclick="goToLobby()">Leave</button>
      </div>
    </div>

    <!-- GAME -->
    <div id="gameScreen" class="screen">
      <div id="status" class="status">Waiting...
        <div id="timerBar" class="timer-bar" style="display:none"><div id="timerFill"></div></div>
        <div id="timerText" style="font-size:0.8rem;margin-top:6px;color:#94a3b8;display:none"></div>
      </div>
      <div id="effect" class="effect"></div>
      <div class="opponents" id="opponents"></div>
      <div class="table">
        <div class="deck" onclick="drawCard()"><div style="font-size:1.2rem">🂠</div><div id="deckCount">0</div></div>
        <div id="discard" class="pile"></div>
      </div>
      <div style="text-align:center;font-size:0.75rem;color:#64748b;margin-bottom:4px" id="handLabel">Your cards</div>
      <div class="hand" id="hand"></div>
      <div class="actions">
        <button class="btn-sec" onclick="goToLobby()">Quit</button>
        <button class="btn-main" id="passBtn" onclick="passTurn()" disabled>Pass</button>
      </div>
    </div>
  </div>

  <div class="winner-screen" id="winnerScreen">
    <h2 id="winnerTitle">Winner!</h2>
    <p id="winnerMsg"></p>
    <div id="scoreBox" style="display:none;background:#1e293b;border-radius:10px;padding:12px;width:100%;max-width:260px;text-align:left"></div>
    <button class="btn-main" style="max-width:200px;margin-top:10px" onclick="goToLobby()">Back to Lobby</button>
  </div>

  <script>
    const SHAPE_ICON = { circle:"●", triangle:"▲", cross:"✚", square:"■", star:"★" };
    const socket = io();
    let me = null;
    let myId = "";
    let state = null;
    let lastDrawn = false;
    let authMode = "login"; // login | register | verify
    let pendingUser = "";

    socket.on("connect", () => {
      myId = socket.id;
      // Stay logged in after browser refresh
      try {
        const raw = localStorage.getItem("whot_session");
        if (raw) {
          const sess = JSON.parse(raw);
          if (sess.username && sess.token) {
            socket.emit("resume_session", { username: sess.username, token: sess.token });
          }
        }
      } catch (e) {}
    });

    socket.on("session_expired", () => {
      localStorage.removeItem("whot_session");
      me = null;
      show("authScreen");
    });

    function show(id) {
      document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
      document.getElementById(id).classList.add("active");
    }
    function showErr(msg) {
      const el = document.getElementById("authErr");
      el.style.display = msg ? "block" : "none";
      el.textContent = msg || "";
    }

    function toggleAuthMode() {
      if (authMode === "login") {
        authMode = "register";
        document.getElementById("authTitle").textContent = "Register";
        document.getElementById("authBtn").textContent = "REGISTER";
        document.getElementById("authEmail").style.display = "block";
        document.getElementById("authSwitch").textContent = "Have account? Sign in";
      } else {
        authMode = "login";
        document.getElementById("authTitle").textContent = "Sign In";
        document.getElementById("authBtn").textContent = "SIGN IN";
        document.getElementById("authEmail").style.display = "none";
        document.getElementById("authSwitch").textContent = "No account? Register";
      }
      showErr("");
      document.getElementById("verifyBox").style.display = "none";
      document.getElementById("authFields").style.display = "block";
    }

    function submitAuth() {
      showErr("");
      if (authMode === "verify") {
        socket.emit("verify", { username: pendingUser, code: document.getElementById("authCode").value });
        return;
      }
      const username = document.getElementById("authUser").value.trim();
      const password = document.getElementById("authPass").value;
      if (authMode === "register") {
        socket.emit("register", {
          username,
          email: document.getElementById("authEmail").value.trim(),
          password
        });
      } else {
        socket.emit("login", { username, password });
      }
    }

    socket.on("auth_error", (msg) => showErr(msg));
    socket.on("verify_required", ({ username, demoCode }) => {
      authMode = "verify";
      pendingUser = username;
      document.getElementById("authTitle").textContent = "Verify Email";
      document.getElementById("authBtn").textContent = "VERIFY";
      document.getElementById("authFields").style.display = "none";
      document.getElementById("verifyBox").style.display = "block";
      document.getElementById("demoCode").textContent = demoCode || "—";
      document.getElementById("authSwitch").textContent = "← Back to sign in";
      showErr("");
    });
    function applyUser(user) {
      if (!user) return;
      me = user;
      if (user.token) {
        localStorage.setItem("whot_session", JSON.stringify({
          username: user.username,
          token: user.token
        }));
      }
      const balEl = document.getElementById("lobbyBal");
      if (balEl) balEl.textContent = "₦" + (user.balance || 0).toLocaleString();
      const nameEl = document.getElementById("lobbyName");
      if (nameEl) nameEl.textContent = user.username;
      document.getElementById("headerSub").textContent = "@" + user.username + " · ₦" + (user.balance || 0).toLocaleString();
    }

    socket.on("auth_ok", (user) => {
      applyUser(user);
      // After refresh, always land in lobby if not mid-game UI still active
      const inGame = document.getElementById("gameScreen").classList.contains("active");
      const inRoom = document.getElementById("roomScreen").classList.contains("active");
      const winShow = document.getElementById("winnerScreen").classList.contains("show");
      if (!inGame && !inRoom && !winShow) {
        show("lobbyScreen");
        refreshRooms();
      }
    });

    socket.on("balance_update", (user) => {
      applyUser(user);
    });

    function fundWallet() {
      const amount = document.getElementById("fundAmt").value;
      socket.emit("fund", { amount });
      document.getElementById("fundAmt").value = "";
    }
    function logout() {
      localStorage.removeItem("whot_session");
      me = null;
      location.reload();
    }

    function goToLobby() {
      document.getElementById("winnerScreen").classList.remove("show");
      lastDrawn = false;
      state = null;
      socket.emit("leave_room");
      socket.emit("get_profile");
      show("lobbyScreen");
      if (me) {
        document.getElementById("lobbyBal").textContent = "₦" + (me.balance || 0).toLocaleString();
        document.getElementById("headerSub").textContent = "@" + me.username + " · ₦" + (me.balance || 0).toLocaleString();
      }
      refreshRooms();
    }

    function createRoom() {
      const stake = document.getElementById("createStake").value;
      socket.emit("create_room", { stake });
    }
    function joinRoom() {
      const code = document.getElementById("codeInput").value.toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (!code) return alert("Enter room code");
      socket.emit("join_room", { code });
    }
    function joinByCode(code) {
      document.getElementById("codeInput").value = code;
      joinRoom();
    }
    function refreshRooms() { socket.emit("list_rooms"); }

    socket.on("rooms_list", (list) => {
      const box = document.getElementById("activeRooms");
      if (!list || !list.length) {
        box.innerHTML = '<p style="color:#94a3b8;font-size:0.85rem">No open rooms</p>';
        return;
      }
      box.innerHTML = list.map(r =>
        `<button class="btn-sec" style="margin-bottom:6px" onclick="joinByCode('${r.code}')">${r.code} · ${r.count}p · stake ₦${r.stake} · ${r.host}</button>`
      ).join("");
    });

    socket.on("room_created", ({ code, stake }) => {
      document.getElementById("roomCode").textContent = code;
      document.getElementById("roomStakeLabel").textContent = stake ? ("Table stake ₦" + stake) : "No stake";
      show("roomScreen");
    });
    socket.on("room_joined", ({ code, stake }) => {
      document.getElementById("roomCode").textContent = code;
      document.getElementById("roomStakeLabel").textContent = stake ? ("Table stake ₦" + stake) : "No stake";
      show("roomScreen");
    });
    socket.on("error_msg", (msg) => alert(msg));

    socket.on("room_state", (s) => {
      state = s;
      if (s.gameOver) { showWinner(s); return; }
      if (s.started) {
        show("gameScreen");
        renderGame(s);
      } else {
        renderLobbyRoom(s);
      }
    });

    function renderLobbyRoom(s) {
      document.getElementById("roomCode").textContent = s.code;
      document.getElementById("roomStakeLabel").textContent = s.stake ? ("Table stake ₦" + s.stake) : "No stake";
      document.getElementById("pCount").textContent = s.players.length;
      document.getElementById("pList").innerHTML = s.players.map(p =>
        `<li><span class="${p.id===myId?'you':''}">${p.name}${p.id===myId?' (you)':''}</span>${p.id===s.hostId?'<span class="host-tag">HOST</span>':''}</li>`
      ).join("");
      const startBtn = document.getElementById("startBtn");
      if (s.hostId === myId) {
        startBtn.style.display = "block";
        startBtn.disabled = s.players.length < 2;
        startBtn.textContent = s.players.length < 2 ? "Need 2+ players" : "▶ Start Game (" + s.players.length + ")";
      } else startBtn.style.display = "none";
    }

    function startGame() { socket.emit("start_game"); }

    let countdownTimer = null;

    function stopCountdown() {
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }

    function startCountdown(endsAt, isMyTurn, playerName, pendingPick) {
      stopCountdown();
      const bar = document.getElementById("timerBar");
      const fill = document.getElementById("timerFill");
      const text = document.getElementById("timerText");
      const st = document.getElementById("status");
      if (!endsAt) {
        bar.style.display = "none";
        text.style.display = "none";
        return;
      }
      bar.style.display = "block";
      text.style.display = "block";
      const total = 15000;

      function tick() {
        const left = Math.max(0, endsAt - Date.now());
        const secs = Math.ceil(left / 1000);
        const pct = Math.max(0, Math.min(100, (left / total) * 100));
        fill.style.width = pct + "%";
        bar.className = "timer-bar" + (secs <= 5 ? " danger" : secs <= 10 ? " warn" : "");

        if (pendingPick > 0 && isMyTurn) {
          st.className = "status warn";
          // keep first text node - set via structure
        } else if (isMyTurn) {
          st.className = "status turn";
        } else {
          st.className = "status";
        }

        if (isMyTurn && pendingPick > 0) {
          text.textContent = "Pick " + pendingPick + " · " + secs + "s left";
          text.style.color = "#fbbf24";
        } else if (isMyTurn) {
          text.textContent = "Your turn · " + secs + "s left";
          text.style.color = secs <= 5 ? "#ef4444" : "#4ade80";
        } else {
          text.textContent = (playerName || "Player") + "'s turn · " + secs + "s left";
          text.style.color = "#94a3b8";
        }

        if (left <= 0) stopCountdown();
      }
      tick();
      countdownTimer = setInterval(tick, 200);
    }

    function renderGame(s) {
      const isMyTurn = s.players[s.current] && s.players[s.current].id === myId;
      const st = document.getElementById("status");
      const playerName = s.players[s.current]?.name || "...";
      // Clear only the label part - timer children stay
      const label = (s.pendingPick > 0 && isMyTurn)
        ? ("You must Pick " + s.pendingPick)
        : isMyTurn ? "Your turn" : (playerName + "'s turn");
      // Update status label without wiping timer nodes
      let labelNode = st.querySelector(".status-label");
      if (!labelNode) {
        labelNode = document.createElement("div");
        labelNode.className = "status-label";
        st.insertBefore(labelNode, st.firstChild);
      }
      labelNode.textContent = label;
      if (s.pendingPick > 0 && isMyTurn) st.className = "status warn";
      else if (isMyTurn) st.className = "status turn";
      else st.className = "status";

      startCountdown(s.turnEndsAt, isMyTurn, playerName, s.pendingPick || 0);
      document.getElementById("effect").textContent = s.effect || "";
      document.getElementById("opponents").innerHTML = s.players.map((p, i) => {
        if (p.id === myId) return "";
        return `<div class="opp ${i===s.current?'active':''}"><div class="name">${p.name}</div><div style="color:#94a3b8">${p.cardCount} cards</div></div>`;
      }).join("");
      document.getElementById("deckCount").textContent = s.deckCount;
      const pile = document.getElementById("discard");
      if (s.topCard) {
        pile.className = "pile card " + s.topCard.shape;
        pile.innerHTML = `<div class="num-tl">${s.topCard.num}</div><div class="shape">${SHAPE_ICON[s.topCard.shape]}</div><div class="num-br">${s.topCard.num}</div>`;
      }
      document.getElementById("handLabel").textContent = isMyTurn ? "Your cards – tap to play" : "Your cards";
      document.getElementById("hand").innerHTML = (s.yourHand || []).map(c => {
        const can = isMyTurn && canPlay(c, s);
        return `<div class="card ${c.shape} ${can?'playable':'disabled'}" onclick="playCard(${c.id})">
          <div class="num-tl">${c.num}</div><div class="shape">${SHAPE_ICON[c.shape]}</div><div class="num-br">${c.num}</div></div>`;
      }).join("");
      document.getElementById("passBtn").disabled = !(isMyTurn && lastDrawn && s.pendingPick === 0);
    }

    function canPlay(card, s) {
      if (s.pendingPick > 0) return false;
      if (!s.topCard) return true;
      return card.shape === s.topCard.shape || card.num === s.topCard.num;
    }
    function playCard(cardId) { lastDrawn = false; socket.emit("play_card", { cardId }); }
    function drawCard() {
      if (!state) return;
      if (state.players[state.current]?.id !== myId) return;
      lastDrawn = true;
      socket.emit("draw_card");
    }
    function passTurn() { lastDrawn = false; socket.emit("pass_turn"); }

    function showWinner(s) {
      document.getElementById("winnerTitle").textContent = s.winner + " Wins!";
      let msg = s.effect || "";
      if (s.potPaid) msg += (msg ? "\n" : "") + "Pot ₦" + s.potPaid.toLocaleString() + " added to winner wallet";
      document.getElementById("winnerMsg").textContent = msg;
      if (me) {
        document.getElementById("winnerMsg").textContent = msg + "\nYour wallet: ₦" + (me.balance || 0).toLocaleString();
      }
      const box = document.getElementById("scoreBox");
      if (s.scores) {
        box.style.display = "block";
        box.innerHTML = s.scores.map((sc, i) =>
          `<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #334155"><span>${i===0?"👑 ":""}${sc.name}</span><span>${sc.total} pts</span></div>`
        ).join("");
      } else box.style.display = "none";
      document.getElementById("winnerScreen").classList.add("show");
      // Refresh wallet from server
      socket.emit("get_profile");
    }
